# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.70 stays 0.70). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
  revision: &revision 2b170fa6309d5d1ee380b35636075fac7945f286
  served_name: &served_name TensorFold/Qwen3.8-Flash-Next-MLX-4bit-MTP
  family: Qwen3.8-Flash-Next
  params: ~180B total MoE, 512 experts top-10, 1 MTP layer, hashed n-gram (PLE) tables
  quant: MLX affine 4-bit, group 32, every linear incl. the n-gram tables and the MTP head (router bf16)

image:
  base: nvcr.io/nvidia/pytorch:26.07-py3
  digest: sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c
  local_tag: &image tf-qwen38-flashnext:0.6.6
  build: docker/Dockerfile (pip install TensorFold at TF_SHA plus xgrammar 0.2.8 and PyAV 19.0.1 for video input; torch/triton from the base, checked)

engine:
  name: tensorfold
  version: 0.6.6
  repo: https://github.com/ashhart/TensorFold
  commit: &tf_sha cb2ebf0540f42604e2759b2ddef497861e928248
  # sha256 of every shipped patch under docker/patches/ (run.sh PATCH_PINS must match; tests/ check the files).
  patches:
    flashnext-tools-0.6.6.patch: 023db6410f210b5fc4ee640435c25703f09f45a91d930c4caf3b531f2ccef875

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    TF_SHA: *tf_sha
    TF_PATCH: patches/flashnext-tools-0.6.6.patch
    CONTAINER_NAME: tf-qwen38-flashnext
    PORT: 8000
    MASTER_PORT: 29551
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1,roceP2p1s0f1
    TP: *tp
    CONTEXT: 262144
    KV_DTYPE: bf16
    MTP_DRAFTS: 15
    MTP_CONFIDENCE: 0.70
    PARALLEL: 1
    THINKING: 0
    MAX_TOKENS: 32768
    TOOL_SYSTEM: "Tool calls: include only the arguments the user explicitly provided or clearly implied. Never fill in optional arguments with default or guessed values."
    VISION: 0
    VISION_URLS: 0
    VISION_MAX_IMAGES: ""
    MEMORY_RESERVE_GIB: ""
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    TF_CACHE: $HOME/.cache/tensorfold-qwen38
    ORCHESTRATE: auto
    OOM_SCORE_ADJ: 1000
    MEMGUARD: 1
    MEMGUARD_MIN_AVAIL_MB: 3072
    MEMGUARD_MIN_SWAP_FREE_MB: 2048
    BENCH_ONLY: 0
    EXTRA_ARGS: ""
    EXTRA_ENV: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Engine: "TensorFold `{TF_SHA}` (v0.6.6), built into `{IMAGE}` from `docker/Dockerfile`"
    - Patch: "`{TF_PATCH}`: `--tool-system` on the CUDA server, a tool call keeps only the parameters the offered tool declares, copy drafts, and image input on two ranks (`docker/patches/README.md`)"
    - Images: "`VISION={VISION}`: off. `VISION=1` serves `image_url` and `video_url` parts on either profile; the tower loads on rank 0 (0.84 GiB plus a 4 GiB encode workspace), rank 1 receives each request's features; on the serial profile an image request decodes eagerly, text keeps its graphs. `VISION_URLS=1` also fetches public https URLs; `VISION_MAX_IMAGES` caps images per request (engine default 4)"
    - Tool system message: "`{TOOL_SYSTEM}` (added by the server to a chat request that offers tools and has no system message; `TOOL_SYSTEM=` serves none)"
    - Model: "`{MODEL}` at `{SNAPSHOT_SHA}`"
    - Ranks: "`--tp {TP}`: rank 1 on `{WORKER_HOST}` first, then rank 0 (HTTP) on the head; rendezvous `{HEAD_IP}:{MASTER_PORT}`"
    - "`--context`": "{CONTEXT} (the native window, on both ranks)"
    - "`--kv-dtype`": "`{KV_DTYPE}`"
    - MTP drafts: "`--mtp-drafts {MTP_DRAFTS} --mtp-confidence {MTP_CONFIDENCE}`"
    - "`--parallel`": "{PARALLEL} by default; `PROFILE=concurrent` (or `PARALLEL=16`) serves sixteen streams on two ranks (TensorFold 0.6.4+)"
    - Default thinking: "off (`THINKING={THINKING}`); requests override with `chat_template_kwargs.enable_thinking`"
    - "`--max-tokens`": "{MAX_TOKENS} (the reply cap when a request sets none)"
    - NCCL: "`NCCL_IB_HCA={HCA}`, `NCCL_SOCKET_IFNAME={IFACE}`"
    - API: "`http://<head>:{PORT}/v1`, served as `{SERVED_NAME}`"
    - Container: "`{CONTAINER_NAME}`"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  decode:
    conditions: streamed greedy, thinking off, max_tokens 200 (prose ends at EOS near 100), 3-run median; TensorFold 0.6.6 at TP=2 with PARALLEL=8, context 262144, kv int8, MTP up to 15 drafts at confidence 0.70, one RoCE HCA; the second bench_decode run on the boot (the first, right after a warm-up request, is bench-frozen-1.out)
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 65.6, aggregate: 65.6, ttft_p50: 0.06, evidence: evidence/s10-tf066/bench-frozen-2.out}
      - {phase: prose, concurrency: 2, decode: 60.3, aggregate: 120.6, ttft_p50: 0.06, evidence: evidence/s10-tf066/bench-frozen-2.out,
         note: "With PARALLEL=8 both streams decode together in shared lane rounds, so the aggregate is real concurrent throughput and the second stream's TTFT is its own prefill, not a queue wait."}
      - {phase: structured, concurrency: 1, decode: 232.9, aggregate: 232.8, ttft_p50: 0.07, evidence: evidence/s10-tf066/bench-frozen-2.out}
      - {phase: structured, concurrency: 2, decode: 210.7, aggregate: 417.5, ttft_p50: 0.09, evidence: evidence/s10-tf066/bench-frozen-2.out,
         note: "Same as note 1."}

